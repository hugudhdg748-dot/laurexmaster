<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laurex AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #ffffff;
    color: #202123;
    height: 100vh;
    overflow: hidden;
}

body.dark {
    background: #171717;
    color: #eeeeee;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: #f7f7f8;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    padding: 15px;
}

.dark .sidebar {
    background: #202123;
    border-color: #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 20px;
    padding: 10px;
}

.logo span {
    color: #7c3aed;
}

.new-chat {
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 15px;
}

.dark .new-chat {
    background: #2b2b2b;
    color: white;
    border-color: #444;
}

.new-chat:hover {
    background: #eeeeee;
}

.dark .new-chat:hover {
    background: #333;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-title {
    font-size: 12px;
    color: #777;
    margin: 10px;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #e5e5e5;
}

.dark .history-item:hover {
    background: #303030;
}

.bottom-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.bottom-buttons button {
    border: none;
    background: transparent;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    color: inherit;
}

.bottom-buttons button:hover {
    background: #e5e5e5;
}

.dark .bottom-buttons button:hover {
    background: #303030;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.dark .topbar {
    border-color: #333;
}

.menu {
    display: none;
    font-size: 25px;
    background: none;
    border: none;
    color: inherit;
}

.top-title {
    font-weight: bold;
    font-size: 18px;
}

.theme {
    border: none;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    max-width: 750px;
    margin: 50px auto;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.welcome h1 span {
    color: #7c3aed;
}

.welcome p {
    color: #777;
    margin-bottom: 30px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.suggestion {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    background: white;
    text-align: left;
}

.dark .suggestion {
    background: #222;
    border-color: #444;
    color: white;
}

.suggestion:hover {
    background: #f1f1f1;
}

.dark .suggestion:hover {
    background: #303030;
}

/* MESSAGES */

.message {
    max-width: 850px;
    margin: 0 auto 20px auto;
    display: flex;
    gap: 12px;
}

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.user-avatar {
    background: #ddd;
}

.ai-avatar {
    background: #7c3aed;
    color: white;
}

.message-content {
    flex: 1;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.copy {
    margin-top: 8px;
    border: none;
    background: transparent;
    color: #777;
    cursor: pointer;
    font-size: 12px;
}

.copy:hover {
    color: #7c3aed;
}

/* THINKING */

.thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    height: 25px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #7c3aed;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.15s;
}

.dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    padding: 15px;
    border-top: 1px solid #ddd;
}

.dark .input-area {
    border-color: #333;
}

.input-box {
    max-width: 850px;
    margin: auto;
    border: 1px solid #ccc;
    border-radius: 15px;
    display: flex;
    align-items: flex-end;
    padding: 8px;
    background: white;
}

.dark .input-box {
    background: #222;
    border-color: #444;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    padding: 10px;
    font-size: 16px;
    background: transparent;
    color: inherit;
    max-height: 150px;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
    font-size: 20px;
}

.send:hover {
    background: #6d28d9;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.disclaimer {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        bottom: 0;
        z-index: 10;
        transition: 0.25s;
    }

    .sidebar.open {
        left: 0;
    }

    .menu {
        display: block;
    }

    .top-title {
        margin-right: auto;
        margin-left: 10px;
    }

    .chat {
        padding: 15px;
    }

    .welcome {
        margin: 35px auto;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .message {
        margin-bottom: 18px;
    }

    .input-area {
        padding: 8px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            ✦ <span>Laurex</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="history">

            <div class="history-title">
                RECENT CHATS
            </div>

            <div id="historyList"></div>

        </div>

        <div class="bottom-buttons">

            <button onclick="toggleTheme()">
                🌙 Dark Mode
            </button>

            <button onclick="clearHistory()">
                🗑 Clear History
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button class="menu" onclick="toggleMenu()">
                ☰
            </button>

            <div class="top-title">
                Laurex AI
            </div>

            <button class="theme" onclick="toggleTheme()">
                🌓
            </button>

        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>
                    Hello, I'm <span>Laurex</span> 👋
                </h1>

                <p>
                    Your smart AI assistant.
                </p>

                <div class="suggestions">

                    <div class="suggestion"
                         onclick="useSuggestion('Explain photosynthesis simply')">
                        🌱 Explain photosynthesis simply
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('Help me learn JavaScript')">
                        💻 Help me learn JavaScript
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('Give me a study plan')">
                        📚 Give me a study plan
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('What can you help me with?')">
                        ✨ What can you help me with?
                    </div>

                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Message Laurex..."
                    onkeydown="handleKey(event)"
                    oninput="resizeInput()"
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                    onclick="sendMessage()">
                    ↑
                </button>

            </div>

            <div class="disclaimer">
                Laurex can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   LAUREX AI BACKEND
========================= */

const API_URL = "https://laurexmaster.onrender.com/chat";


/* =========================
   APP DATA
========================= */

let messages = [];

let chats =
    JSON.parse(
        localStorage.getItem("laurexChats") || "[]"
    );


const chat = document.getElementById("chat");

const input = document.getElementById("input");

const welcome =
    document.getElementById("welcome");

const sendButton =
    document.getElementById("sendButton");


/* =========================
   LOAD THEME
========================= */

if (
    localStorage.getItem("laurexTheme") === "dark"
) {
    document.body.classList.add("dark");
}


/* =========================
   SEND MESSAGE TO REAL AI
========================= */

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;


    /* Hide welcome screen */

    if (messages.length === 0) {
        welcome.style.display = "none";
    }


    /* Show user's message */

    addMessage("user", text);

    messages.push({
        role: "user",
        content: text
    });


    /* Clear input */

    input.value = "";

    resizeInput();


    /* Disable button */

    sendButton.disabled = true;


    /* Show thinking */

    const thinkingMessage =
        addThinkingMessage();


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


        /* Remove thinking */

        if (thinkingMessage) {
            thinkingMessage.remove();
        }


        /* Check server response */

        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const data =
            await response.json();


        /* Check AI reply */

        if (!data.reply) {

            throw new Error(
                "No AI reply received"
            );

        }


        /* Show AI response */

        addMessage(
            "assistant",
            data.reply
        );


        /* Save message */

        messages.push({
            role: "assistant",
            content: data.reply
        });


        /* Save chat */

        saveChat();


    } catch (error) {

        console.error(
            "Laurex error:",
            error
        );


        if (thinkingMessage) {
            thinkingMessage.remove();
        }


        addMessage(
            "assistant",
            "⚠️ Sorry, I couldn't connect to Laurex AI right now.\n\nPlease check your internet connection and try again."
        );

    } finally {

        sendButton.disabled = false;

        input.focus();

    }
}


/* =========================
   THINKING ANIMATION
========================= */

function addThinkingMessage() {

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar ai-avatar";

    avatar.textContent = "✦";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const thinking =
        document.createElement("div");

    thinking.className =
        "thinking";


    for (let i = 0; i < 3; i++) {

        const dot =
            document.createElement("div");

        dot.className = "dot";

        thinking.appendChild(dot);

    }


    content.appendChild(thinking);

    wrapper.appendChild(avatar);

    wrapper.appendChild(content);

    chat.appendChild(wrapper);


    chat.scrollTop =
        chat.scrollHeight;


    return wrapper;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(role, text) {

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            role === "user"
            ? "user-avatar"
            : "ai-avatar"
        );


    avatar.textContent =
        role === "user"
        ? "👤"
        : "✦";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    content.textContent = text;


    wrapper.appendChild(avatar);

    wrapper.appendChild(content);


    /* Copy button for AI */

    if (role === "assistant") {

        const copy =
            document.createElement("button");

        copy.className = "copy";

        copy.textContent =
            "📋 Copy";


        copy.onclick = async () => {

            try {

                await navigator.clipboard
                    .writeText(text);

                copy.textContent =
                    "✓ Copied";

                setTimeout(() => {

                    copy.textContent =
                        "📋 Copy";

                }, 1500);

            } catch {

                copy.textContent =
                    "Copy failed";

            }

        };


        content.appendChild(
            document.createElement("br")
        );

        content.appendChild(copy);
    }


    chat.appendChild(wrapper);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   SUGGESTIONS
========================= */

function useSuggestion(text) {

    input.value = text;

    resizeInput();

    sendMessage();
}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    messages = [];

    chat.innerHTML = "";

    chat.appendChild(welcome);

    welcome.style.display = "block";

    input.value = "";

    resizeInput();

    toggleMenu(false);

    input.focus();
}


/* =========================
   SAVE CHAT
========================= */

function saveChat() {

    if (messages.length === 0) {
        return;
    }


    const firstUserMessage =
        messages.find(
            m => m.role === "user"
        );


    const title =
        firstUserMessage
        ? firstUserMessage.content
            .substring(0, 35)
        : "New Chat";


    const data = {

        title: title,

        messages:
            JSON.parse(
                JSON.stringify(messages)
            ),

        date: Date.now()

    };


    chats.unshift(data);


    /* Keep maximum 20 chats */

    chats =
        chats.slice(0, 20);


    localStorage.setItem(
        "laurexChats",
        JSON.stringify(chats)
    );


    renderHistory();
}


/* =========================
   HISTORY
========================= */

function renderHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    chats.forEach(
        (item, index) => {

            const div =
                document.createElement("div");


            div.className =
                "history-item";


            div.textContent =
                item.title;


            div.onclick =
                () => loadChat(index);


            list.appendChild(div);

        }
    );
}


/* =========================
   LOAD CHAT
========================= */

function loadChat(index) {

    const selected =
        chats[index];


    if (!selected) {
        return;
    }


    messages =
        JSON.parse(
            JSON.stringify(
                selected.messages
            )
        );


    chat.innerHTML = "";


    messages.forEach(
        message => {

            addMessage(
                message.role,
                message.content
            );

        }
    );


    toggleMenu(false);
}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory() {

    if (
        !confirm(
            "Delete all saved chats?"
        )
    ) {
        return;
    }


    chats = [];


    localStorage.removeItem(
        "laurexChats"
    );


    renderHistory();


    newChat();
}


/* =========================
   DARK MODE
========================= */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(

        "laurexTheme",

        document.body.classList.contains(
            "dark"
        )
        ? "dark"
        : "light"

    );
}


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(force) {

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    if (force === false) {

        sidebar.classList.remove(
            "open"
        );

        return;
    }


    sidebar.classList.toggle(
        "open"
    );
}


/* =========================
   ENTER KEY
========================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }
}


/* =========================
   AUTO RESIZE
========================= */

function resizeInput() {

    input.style.height = "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";
}


/* =========================
   START APP
========================= */

renderHistory();

input.focus();

</script>

</body>
</html>
